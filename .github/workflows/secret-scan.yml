# secret-scan：把"GitHub/各厂商 token 是否泄露进会被推到公开库的内容"这道手工审计
# 固化成 push 前/CI 自动守护（gitleaks 风格，但用本仓一贯的纯 stdlib 自带门禁，不引入
# 外部二进制依赖）。判据与差分锁的唯一真相源是 Nebula-agent/tools/secret_scan.py：
#   - 真实凭据形态（GitHub classic/fine-grained PAT、AWS/Slack/OpenAI/HF/Stripe 等强前缀）
#     出现在被 git 跟踪的文件里 -> 红；
#   - 占位符（<TOKEN> / ghp_xxxxx / 星号脱敏）、变量名（GITHUB_TOKEN / x-access-token /
#     Bearer / --token-file / tokens/new 链接）、以及 .Nebula-secrets/ 这类已被 .gitignore
#     排除的路径 -> 绿（这正是上次手工逐行核对后排除的写法，自动化后不再需要人看）。
# 为什么独立成一条、不挂到 build-release.yml 上：build-release.yml 只在 push tag / 手动时
# 跑，而 secret 泄露风险发生在每一次普通 push；本门禁 on: push + pull_request，恰好补上那一段。
name: secret-scan

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 扫的是 checkout 工作区里被 git 跟踪的文件——也就是真正会被推到公开远端的内容全集。
      # 脚本自己用 git rev-parse --show-toplevel 定位仓库顶层（即此处 checkout 的根），
      # 不需要硬编码子目录。退出码 0=干净、1=有发现，CI 据此红/绿。
      - name: Scan tracked files for real credentials
        run: python3 Nebula-agent/tools/secret_scan.py
