name: strata-agent
version: 1.0.0
description: Plugin that gives Strata full agent capabilities (loop, tools, memory, skills, policy).
entry: runtime/gateway.py
min_python: "3.10"
requires_strata_api:
  - /v1/chat/completions
  - /v1/messages
  - /health
tools:
  - servers/fs_server.py
  - servers/shell_server.py
  - servers/websearch_server.py
  - servers/memory_server.py
skills_dir: skills
config: config/mcp_servers.json
